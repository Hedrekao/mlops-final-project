steps:
  # Build training image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/mlops-registry/postings-classifier-train:$SHORT_SHA'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/mlops-registry/postings-classifier-train:latest'
      - '-f'
      - 'dockerfiles/train.dockerfile'
      - '.'
    id: 'build-train'

  # Build API image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/mlops-registry/postings-classifier-api:$SHORT_SHA'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/mlops-registry/postings-classifier-api:latest'
      - '-f'
      - 'dockerfiles/api.dockerfile'
      - '.'
    id: 'build-api'

  # Push training image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/mlops-registry/postings-classifier-train:$SHORT_SHA'
    id: 'push-train'
    waitFor: ['build-train']

  # Push training image (latest tag)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/mlops-registry/postings-classifier-train:latest'
    waitFor: ['build-train']

  # Push API image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/mlops-registry/postings-classifier-api:$SHORT_SHA'
    id: 'push-api'
    waitFor: ['build-api']

  # Push API image (latest tag)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/mlops-registry/postings-classifier-api:latest'
    waitFor: ['build-api']

  # Deploy API to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'postings-classifier-api'
      - '--image=europe-west1-docker.pkg.dev/$PROJECT_ID/mlops-registry/postings-classifier-api:$SHORT_SHA'
      - '--region=europe-west1'
      - '--platform=managed'
      - '--memory=4Gi'
      - '--cpu=2'
      - '--allow-unauthenticated'
      - '--set-env-vars=MODEL_CHECKPOINT=/gcs/jop-postings-mlops-data/models/checkpoints/best.ckpt,HF_MODEL_PATH=/gcs/jop-postings-mlops-data/hf/distilbert-base-uncased,HF_HOME=/gcs/jop-postings-mlops-data/huggingface,TRANSFORMERS_OFFLINE=1'
      - '--add-volume=name=gcs-1,type=cloud-storage,bucket=jop-postings-mlops-data'
      - '--add-volume-mount=volume=gcs-1,mount-path=/gcs/jop-postings-mlops-data'
      - '--service-account=cloud-run-sa@$PROJECT_ID.iam.gserviceaccount.com'
    waitFor: ['push-api']

images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/mlops-registry/postings-classifier-train:$SHORT_SHA'
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/mlops-registry/postings-classifier-train:latest'
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/mlops-registry/postings-classifier-api:$SHORT_SHA'
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/mlops-registry/postings-classifier-api:latest'

options:
  logging: CLOUD_LOGGING_ONLY
