name: Unit Tests

on:
  push:
    branches: [main, "**"]
  pull_request:
    branches: [main, "**"]
jobs:
  test:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        fail-fast: false
        operating-system: ["ubuntu-latest", "windows-latest", "macos-latest"]
        python-version: ["3.12", "3.11"]
        # Optional PyTorch matrix axis: use `cpu-default` to skip installing
        # an explicit torch wheel (use uv-managed dependencies). Add explicit
        # versions to test multiple torch releases (M17 requirement).
        pytorch-version: ["cpu-default", "2.2.0"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --locked --dev
          uv tree

      - name: Install PyTorch (CPU wheel)
        run: |
          uv run pip install "torch==${{ matrix.pytorch }}" --index-url https://download.pytorch.org/whl/cpu || true

      - name: Lint (ruff)
        run: |
          uv run ruff check . --fix || true
          uv run ruff format .

      - name: Run tests & coverage
        run: |
          uv run coverage run -m pytest tests/
          uv run coverage report -m