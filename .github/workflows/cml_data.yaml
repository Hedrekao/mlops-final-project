name: Data Validation Workflow

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.dvc'
      - '.dvc/**'
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate_data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync --frozen
          uv pip list

      - name: Auth with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCLOUD_SERVICE_KEY }}

      - name: Pull data from DVC
        run: |
          uv run dvc pull --no-run-cache

      - name: Check data statistics
        run: |
          uv run python scripts/dataset_statistics.py

      - name: Setup CML
        if: github.event_name == 'pull_request'
        uses: iterative/setup-cml@v2

      - name: Generate and post CML report
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## Dataset Statistics Report" > report.md
          echo "" >> report.md
          uv run python scripts/dataset_statistics.py --markdown >> report.md
          cml comment create report.md --watermark-title="Data Validation"
