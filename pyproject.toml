[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[project]
name = "postings_classifier"
version = "0.0.1"
description = "Final project for DTU mlops course"
authors = [
  { name = "hedrekao", email = "your@email.com" },
]
license = { file = "LICENSE" }
keywords = ["machine learning", "MLOps"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "hydra-core>=1.3.2",
    "kaggle>=1.8.3",
    "lightning>=2.6.0",
    "loguru>=0.7.2",
    "pandas>=2.3.3",
    "scikit-learn>=1.8.0",
    "tensorboard>=2.20.0",
    "torch==2.6.0",
    "torch-tb-profiler>=0.4.3",
    "transformers>=4.57.3",
    "typer==0.21.1",
    "uvicorn==0.34.0",
    "mypy==1.19.1",
    "httpx>=0.28.1",
    "types-markdown>=3.10.0.20251106",
    "pandas-stubs>=2.3.3.251219",
    "matplotlib-stubs>=0.3.11",
    "wandb>=0.23.1",
]


[dependency-groups]
dev = [
    "coverage==7.13.1",
    "invoke==2.2.1",
    "mkdocs-material==9.7.1",
    "mkdocs==1.6.1",
    "pre-commit==4.1.0",
    "pytest==9.0.2",
    "ruff==0.14.11",
    "mkdocstrings-python==1.12.2",
]


[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120

[tool.coverage.run]
omit = [
    "tests/*",
    "*/tmp/*",
    "*/_remote_module_non_scriptable.py",
]

[tool.coverage.report]
skip_empty = true
ignore_errors = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
